<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
	<defs>
		<path id="body-shape" d="M256 90C326 90 382 126 390 200c6 62 6 122-8 162-16 42-62 58-126 58s-110-16-126-58c-14-40-14-100-8-162C130 126 186 90 256 90Z"/>
		<clipPath id="body-clip"><use href="#body-shape"/></clipPath>

		<!-- 몸: 정수리가 밝고 가장자리와 아래가 어두움 -->
		<radialGradient id="body" cx="0.48" cy="0.18" r="0.9">
			<stop offset="0" stop-color="#EE2E22"/>
			<stop offset="0.55" stop-color="#E8231E"/>
			<stop offset="1" stop-color="#DF1F1D"/>
		</radialGradient>
		<radialGradient id="body-edge" cx="0.5" cy="0.42" r="0.62">
			<stop offset="0.72" stop-color="#7A0008" stop-opacity="0"/>
			<stop offset="1" stop-color="#7A0008" stop-opacity="0.08"/>
		</radialGradient>
		<radialGradient id="sheen" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#FFFFFF" stop-opacity="0.06"/>
			<stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
		</radialGradient>
		<!-- 날개: 바깥이 밝고 몸에 붙은 안쪽이 접힌 듯 어두움 -->
		<linearGradient id="wing" x1="0" y1="0.2" x2="1" y2="0.6">
			<stop offset="0" stop-color="#EA2920"/>
			<stop offset="0.6" stop-color="#E6231E"/>
			<stop offset="1" stop-color="#D01A1C"/>
		</linearGradient>
		<linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#FDBC1E"/>
			<stop offset="0.5" stop-color="#FCB614"/>
			<stop offset="1" stop-color="#F9B011"/>
		</linearGradient>

		<!-- 헤드폰 -->
		<linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#454545"/>
			<stop offset="1" stop-color="#3D3D3D"/>
		</linearGradient>
		<linearGradient id="shell" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#363636"/>
			<stop offset="0.5" stop-color="#3E3E3E"/>
			<stop offset="1" stop-color="#3A3A3A"/>
		</linearGradient>
		<linearGradient id="cushion" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#424242"/>
			<stop offset="0.45" stop-color="#4B4B4B"/>
			<stop offset="1" stop-color="#444444"/>
		</linearGradient>
		<radialGradient id="contact" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#5A0006" stop-opacity="0.18"/>
			<stop offset="1" stop-color="#5A0006" stop-opacity="0"/>
		</radialGradient>

		<!-- 눈 -->
		<radialGradient id="eye" cx="0.45" cy="0.4" r="0.62">
			<stop offset="0.6" stop-color="#FFFCF5"/>
			<stop offset="1" stop-color="#F6F0E4"/>
		</radialGradient>
		<radialGradient id="pupil" cx="0.4" cy="0.3" r="0.8">
			<stop offset="0" stop-color="#2A2A2A"/>
			<stop offset="1" stop-color="#0E0E0E"/>
		</radialGradient>

		<!-- 부리와 입 -->
		<radialGradient id="beak" cx="0.42" cy="0.22" r="0.85">
			<stop offset="0" stop-color="#474747"/>
			<stop offset="0.55" stop-color="#3D3D3D"/>
			<stop offset="1" stop-color="#343434"/>
		</radialGradient>
		<linearGradient id="tongue" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#FF8592"/>
			<stop offset="1" stop-color="#E8566B"/>
		</linearGradient>

		<!-- 발: 발가락은 왼쪽 위가 밝은 조약돌 모양, 다리는 배 아래가 그늘짐 -->
		<radialGradient id="toe" cx="0.4" cy="0.32" r="0.72">
			<stop offset="0" stop-color="#FAB415"/>
			<stop offset="0.65" stop-color="#F7AA06"/>
			<stop offset="1" stop-color="#EE9F02"/>
		</radialGradient>
		<radialGradient id="toe-front" cx="0.34" cy="0.3" r="0.82">
			<stop offset="0" stop-color="#FAB415"/>
			<stop offset="0.55" stop-color="#F7AA06"/>
			<stop offset="1" stop-color="#E89801"/>
		</radialGradient>
		<linearGradient id="leg" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#EC9E04"/>
			<stop offset="0.45" stop-color="#F5A70B"/>
			<stop offset="1" stop-color="#EB9C03"/>
		</linearGradient>
		<linearGradient id="leg-shade" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#9A5A00" stop-opacity="0.22"/>
			<stop offset="0.6" stop-color="#9A5A00" stop-opacity="0"/>
		</linearGradient>
		<radialGradient id="toe-shade" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#A65F00" stop-opacity="0.2"/>
			<stop offset="1" stop-color="#A65F00" stop-opacity="0"/>
		</radialGradient>
	</defs>

	<!-- 헤드폰 머리띠 -->
	<path d="M124 168C122 102 182 69 256 69s134 33 132 99" fill="none" stroke="url(#band)" stroke-width="16" stroke-linecap="round"/>
	<path d="M129 150C136 98 190 64 256 64s120 34 127 86" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="3" stroke-linecap="round"/>

	<!-- 발: 다리, 바깥 발가락, 오른쪽 끝이 어두운 앞 발가락 순서로 겹침 -->
	<g id="foot-left">
		<rect x="191" y="404" width="28" height="30" fill="url(#leg)"/>
		<rect x="191" y="404" width="28" height="30" fill="url(#leg-shade)"/>
		<ellipse cx="205" cy="432" rx="15" ry="5" fill="url(#toe-shade)"/>
		<ellipse cx="184" cy="436.5" rx="14.5" ry="10" transform="rotate(-10 184 436.5)" fill="url(#toe)"/>
		<ellipse cx="194" cy="437" rx="5" ry="6" fill="url(#toe-shade)"/>
		<ellipse cx="207" cy="439" rx="14.5" ry="10" transform="rotate(-8 207 439)" fill="url(#toe-front)"/>
	</g>
	<use href="#foot-left" transform="matrix(-1 0 0 1 512 0)"/>

	<!-- 몸과 배 -->
	<use href="#body-shape" fill="url(#body)"/>
	<path d="M132 398C140 340 200 310 256 310s116 30 124 88v42H132Z" fill="url(#belly)" clip-path="url(#body-clip)"/>
	<use href="#body-shape" fill="url(#body-edge)"/>
	<ellipse cx="240" cy="122" rx="70" ry="30" fill="url(#sheen)"/>

	<!-- 이어컵이 머리에 닿는 자리의 그림자 -->
	<ellipse cx="154" cy="192" rx="12" ry="46" fill="url(#contact)"/>
	<ellipse cx="358" cy="192" rx="12" ry="46" fill="url(#contact)"/>

	<!-- 날개 -->
	<g id="wing-left">
		<ellipse cx="110" cy="288" rx="24" ry="60" transform="rotate(24 110 288)" fill="url(#wing)"/>
	</g>
	<use href="#wing-left" transform="matrix(-1 0 0 1 512 0)"/>

	<!-- 헤드폰 이어컵: 머리 쪽 쿠션과 바깥 커버 -->
	<g id="cup-left">
		<rect x="116" y="145" width="33" height="90" rx="15" fill="url(#cushion)"/>
		<rect x="100" y="150" width="27" height="80" rx="13" fill="url(#shell)"/>
		<path d="M127 158v64" stroke="#262626" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
		<rect x="105" y="158" width="5" height="44" rx="2.5" fill="#FFFFFF" fill-opacity="0.04"/>
	</g>
	<use href="#cup-left" transform="matrix(-1 0 0 1 512 0)"/>

	<!-- 눈 -->
	<ellipse cx="198.5" cy="192.5" rx="33.5" ry="46" fill="url(#eye)"/>
	<ellipse cx="313" cy="192.5" rx="33.5" ry="46" fill="url(#eye)"/>
	<ellipse cx="204.5" cy="198" rx="16" ry="23" fill="url(#pupil)"/>
	<ellipse cx="307" cy="198" rx="16" ry="23" fill="url(#pupil)"/>
	<circle cx="209.5" cy="187.5" r="6.5" fill="#FFFFFF"/>
	<circle cx="311.5" cy="187.5" r="6.5" fill="#FFFFFF"/>

	<!-- 부리 아래 그림자, 부리, 입 -->
	<ellipse cx="257" cy="298" rx="30" ry="13" fill="url(#contact)"/>
	<path d="M256 198c24 0 40 16 40 40 0 24-20 50-40 63-20-13-40-39-40-63 0-24 16-40 40-40Z" fill="url(#beak)"/>
	<ellipse cx="246" cy="216" rx="16" ry="8" fill="#FFFFFF" fill-opacity="0.03"/>
	<path d="M234 258c12-4 32-4 44 0 2 16-8 29-22 35-14-6-24-19-22-35Z" fill="#7E141C"/>
	<path d="M238 266c8-4 28-4 36 0 0 13-8 22-18 25-10-3-18-12-18-25Z" fill="url(#tongue)"/>
	<path d="M256 268v14" stroke="#C93D52" stroke-opacity="0.6" stroke-width="1.6" stroke-linecap="round"/>
</svg>
