name: Deploy

# 배포 역할의 신뢰 정책 sub 이 refs/heads/main 이라 이 job 에 environment: 를 붙이면 assume 가 실패한다.
# 캐시 전략과 allowlist 규칙은 README "배포".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-site-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: S3 배포 + CloudFront 무효화
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Stamp asset versions
        run: python3 scripts/stamp-assets.py

      # 새 서빙 경로는 아래 --include 에 추가한다. privacy/·terms/·support/ 는 지운 옛 스텁이라
      # 필터에 남겨 두어야 --delete 가 버킷에서도 지운다.
      - name: S3 sync (assets, long cache)
        run: |
          aws s3 sync . "s3://${{ secrets.SITE_BUCKET }}" --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*" \
            --include "assets/*" \
            --exclude "assets/og-image*" \
            --exclude "assets/icons/app-icon.png"

      - name: S3 sync (pages, revalidate)
        run: |
          aws s3 sync . "s3://${{ secrets.SITE_BUCKET }}" --delete \
            --cache-control "public, max-age=0, must-revalidate, s-maxage=31536000" \
            --exclude "*" \
            --include "index.html" \
            --include "naver349fb6aafe7542a79514196f0b05ae53.html" \
            --include "robots.txt" \
            --include "sitemap.xml" \
            --include "llms.txt" \
            --include "assets/og-image*" \
            --include "assets/icons/app-icon.png" \
            --include "ko/*" \
            --include "en/*" \
            --include "ja/*" \
            --include "ru/*" \
            --include "es/*" \
            --include "zh-tw/*" \
            --include "zh-cn/*" \
            --include "dl/*" \
            --include "privacy/*" \
            --include "terms/*" \
            --include "support/*"

      - name: CloudFront invalidation
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.SITE_DISTRIBUTION_ID }}" \
            --paths "/*"
