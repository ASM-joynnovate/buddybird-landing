name: Release

# dev push 마다 release-please 가 마지막 태그 이후 커밋을 읽어 릴리스 PR(dev 대상)을 만들거나 갱신한다.
# 릴리스 PR 을 머지하면 dev 에 태그(vX.Y.Z)와 GitHub Release 가 생기고, 그 상태를 dev → main 으로 배포한다.
# buddybird-api 와 같은 구성이다. 설정은 .github/release-please-config.json.
#
# main 이 아니라 dev 에서 도는 이유: release-please 는 커밋을 날짜 역순으로 읽다가 직전 릴리스 커밋에서 멈춘다
# (googleapis/release-please#2883). dev→main 머지 커밋으로 들어온 커밋은 원래 날짜를 그대로 가져
# 직전 릴리스 커밋보다 "과거"로 읽혀 빠질 수 있다. dev 는 squash 머지만 받아 커밋 날짜가 머지 순서와 같다.
#
# 토큰은 기본 GITHUB_TOKEN 이다(buddybird-api·ai-api·mbti-web 과 같음). 이 토큰이 만든 PR 에서는
# GitHub 정책상 CI 가 돌지 않지만, 릴리스 PR 은 CHANGELOG 와 manifest 만 고쳐 그대로 머지한다.
# issues: write 는 릴리스 PR 에 autorelease 라벨을 만들고 붙이는 데 필요하다.
# target-branch: 기본 브랜치도 dev 지만 대상이 바뀌지 않게 명시한다.
on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: 릴리스 PR·태그
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          target-branch: dev
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
