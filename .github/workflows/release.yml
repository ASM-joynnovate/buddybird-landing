name: Release

# main push(= 배포)마다 release-please 가 커밋을 읽어 릴리스 PR 을 만들거나 갱신한다.
# 릴리스 PR 을 머지하면 태그(vX.Y.Z)와 GitHub Release 가 생긴다. 태그가 곧 배포된 버전이다.
# 릴리스 PR 은 CHANGELOG.md 와 .github/.release-please-manifest.json 만 고치므로
# deploy.yml 의 paths-ignore 로 재배포하지 않는다. 설정은 .github/release-please-config.json.
#
# 토큰은 기본 GITHUB_TOKEN 이다(buddybird-api·ai-api·mbti-web 과 같음). 이 토큰이 만든 PR 에서는
# GitHub 정책상 CI 가 돌지 않지만, 릴리스 PR 은 사이트 파일을 건드리지 않고 main 에 필수 검사도 없어 그대로 머지한다.
# issues: write 는 릴리스 PR 에 autorelease 라벨을 만들고 붙이는 데 필요하다.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: 릴리스 PR·태그
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
