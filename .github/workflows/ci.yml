name: CI

# dev/main 으로 올리는 PR 에서 머지 전 검증. 실제 배포는 deploy.yml(main push → S3/CloudFront)이 담당.
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: 내부 링크·에셋 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 scripts/check-links.py
      # 일본어 문구에 새 글자가 생겼는데 글꼴 서브셋을 다시 만들지 않았으면 실패한다
      - run: python3 scripts/subset-fonts.py --check

  html:
    name: HTML 유효성 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npx --yes html-validate@11 "**/*.html"
