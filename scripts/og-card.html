<!DOCTYPE html>
<!--
  og-card.html — buddybird.xyz 링크 공유 미리보기(og-image.png / og-image-en.png / og-image-ja.png / og-image-ru.png / og-image-es.png / og-image-zh-tw.png / og-image-zh-cn.png / og-image-th.png / og-image-bn.png / og-image-hi.png / og-image-vi.png) 생성용 소스.
  헤드리스 Chrome로 1200×630 렌더 → 한국어는 그대로, 영어는 ?lang=en, 일본어는 ?lang=ja, 러시아어는 ?lang=ru, 스페인어는 ?lang=es, 번체 중국어는 ?lang=zh-tw, 간체 중국어는 ?lang=zh-cn, 태국어는 ?lang=th, 벵골어는 ?lang=bn, 힌디어는 ?lang=hi, 베트남어는 ?lang=vi 로 렌더.
    chrome --headless=new --window-size=1200,630 --virtual-time-budget=5000 \
      --screenshot=assets/og-image.png    "http://localhost:8910/scripts/og-card.html"
    chrome --headless=new --window-size=1200,630 --virtual-time-budget=5000 \
      --screenshot=assets/og-image-en.png "http://localhost:8910/scripts/og-card.html?lang=en"
    chrome --headless=new --window-size=1200,630 --virtual-time-budget=5000 \
      --screenshot=assets/og-image-ja.png "http://localhost:8910/scripts/og-card.html?lang=ja"
    chrome --headless=new --window-size=1200,630 --virtual-time-budget=5000 \
      --screenshot=assets/og-image-ru.png "http://localhost:8910/scripts/og-card.html?lang=ru"
    chrome --headless=new --window-size=1200,630 --virtual-time-budget=5000 \
      --screenshot=assets/og-image-es.png "http://localhost:8910/scripts/og-card.html?lang=es"
    chrome --headless=new --window-size=1200,630 --virtual-time-budget=5000 \
      --screenshot=assets/og-image-zh-tw.png "http://localhost:8910/scripts/og-card.html?lang=zh-tw"
    chrome --headless=new --window-size=1200,630 --virtual-time-budget=5000 \
      --screenshot=assets/og-image-zh-cn.png "http://localhost:8910/scripts/og-card.html?lang=zh-cn"
    chrome --headless=new --window-size=1200,630 --virtual-time-budget=5000 \
      --screenshot=assets/og-image-th.png "http://localhost:8910/scripts/og-card.html?lang=th"
    chrome --headless=new --window-size=1200,630 --virtual-time-budget=5000 \
      --screenshot=assets/og-image-bn.png "http://localhost:8910/scripts/og-card.html?lang=bn"
    chrome --headless=new --window-size=1200,630 --virtual-time-budget=5000 \
      --screenshot=assets/og-image-hi.png "http://localhost:8910/scripts/og-card.html?lang=hi"
    chrome --headless=new --window-size=1200,630 --virtual-time-budget=5000 \
      --screenshot=assets/og-image-vi.png "http://localhost:8910/scripts/og-card.html?lang=vi"
  (사이트 본문이 아니라 OG 이미지 빌드용 파일입니다.)
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>BuddyBird OG card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 태국어 카드: 페이지와 같은 Mitr 서브셋. 페이지 굵기 700·800·900 을 Mitr 500·600·700 으로 그린다 */
  @font-face{font-family:"Mitr TH";font-weight:700;src:url(../assets/fonts/mitr-th-500.woff2) format("woff2")}
  @font-face{font-family:"Mitr TH";font-weight:800;src:url(../assets/fonts/mitr-th-600.woff2) format("woff2")}
  @font-face{font-family:"Mitr TH";font-weight:900;src:url(../assets/fonts/mitr-th-700.woff2) format("woff2")}
  /* 벵골어 카드: 페이지와 같은 Baloo Da 2 서브셋. 페이지 굵기 700·800·900 을 Baloo Da 2 600·700·800 으로 그린다 */
  @font-face{font-family:"Baloo Da 2 BN";font-weight:700;src:url(../assets/fonts/baloo-da-2-bn-600.woff2) format("woff2")}
  @font-face{font-family:"Baloo Da 2 BN";font-weight:800;src:url(../assets/fonts/baloo-da-2-bn-700.woff2) format("woff2")}
  @font-face{font-family:"Baloo Da 2 BN";font-weight:900;src:url(../assets/fonts/baloo-da-2-bn-800.woff2) format("woff2")}
  /* 힌디어 카드: 페이지와 같은 Baloo 2 서브셋. 페이지 굵기 700·800·900 을 Baloo 2 600·700·800 으로 그린다 */
  @font-face{font-family:"Baloo 2 HI";font-weight:700;src:url(../assets/fonts/baloo-2-hi-600.woff2) format("woff2")}
  @font-face{font-family:"Baloo 2 HI";font-weight:800;src:url(../assets/fonts/baloo-2-hi-700.woff2) format("woff2")}
  @font-face{font-family:"Baloo 2 HI";font-weight:900;src:url(../assets/fonts/baloo-2-hi-800.woff2) format("woff2")}
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #FFF4E3;
    font-family: 'Nunito', 'Mitr TH', 'Baloo Da 2 BN', 'Baloo 2 HI', 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif;
    color: #3C3C3C; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    word-break: keep-all;
  }
  .left { position: absolute; left: 84px; top: 0; bottom: 0; width: 620px; display: flex; flex-direction: column; justify-content: center; gap: 28px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .logo { width: 64px; height: 64px; border-radius: 16px; display: block; box-shadow: 0 3px 0 rgba(0,0,0,0.12); }
  .wordmark { font-weight: 900; font-size: 34px; letter-spacing: -0.01em; }
  h1 { margin: 0; font-weight: 900; font-size: 58px; line-height: 1.16; letter-spacing: -0.02em; }
  h1 .hl { background: linear-gradient(transparent 62%, #FFC800 62%, #FFC800 92%, transparent 92%); padding: 0 .06em; }
  html[lang="en"] h1 { font-size: 48px; }
  html[lang="ja"] h1 { font-size: 52px; }
  html[lang="ru"] h1 { font-size: 46px; }
  html[lang="es"] h1 { font-size: 46px; }
  html[lang="zh-Hant-TW"] h1, html[lang="zh-Hans-CN"] h1 { font-size: 52px; }
  html[lang="th"] h1 { font-size: 46px; line-height: 1.3; }
  html[lang="bn"] h1 { font-size: 50px; line-height: 1.3; }
  html[lang="hi"] h1 { font-size: 48px; line-height: 1.3; }
  html[lang="vi"] h1 { font-size: 46px; }
  .free { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 21px; color: #6B5A45; }
  .free b { color: #3C3C3C; }

  /* the phone: the app's own capture already carries its status bar and island */
  .phone { position: absolute; right: 110px; top: 64px; width: 300px; padding: 9px; border-radius: 50px;
           background: #1E1E1E; box-shadow: 0 40px 80px rgba(0,0,0,0.20), 0 0 0 1px rgba(0,0,0,0.10); }
  .phone img { display: block; width: 100%; height: auto; border-radius: 42px; }

  /* floating notes: true product facts only */
  .note { position: absolute; z-index: 2; display: flex; align-items: center; gap: 12px; background: #fff;
          border: 2px solid #E5E5E5; border-radius: 18px; box-shadow: 0 4px 0 #E5E5E5; padding: 12px 18px 12px 12px;
          font-weight: 900; font-size: 18px; }
  .note .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; }
  .note svg { width: 20px; height: 20px; }
  .n1 { top: 66px; right: 344px; }
  .n1 .ic { background: #FFE5E5; color: #E04343; }
  .n2 { top: 404px; right: 330px; }
  .n2 .ic { background: #FF9600; color: #fff; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand">
      <img class="logo" src="../assets/icons/app-icon.png" alt="BuddyBird">
      <span class="wordmark">BuddyBird</span>
    </div>
    <h1 id="h">보호자가 집을 비운 하루,<br><span class="hl">앵무새는 말을 배웁니다</span></h1>
    <span class="free" id="f"><b>App Store · Google Play</b>for free</span>
  </div>

  <div class="note n1"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="3" width="7" height="12" rx="3.5" fill="currentColor"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span><span id="t1">보호자 목소리로 녹음</span></div>
  <div class="phone"><img id="shot" src="../assets/images/ko/screen-summary.webp" alt=""></div>
  <div class="note n2"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 4.8v14.4c0 .9 1 1.4 1.7.9l10.6-7.2c.6-.4.6-1.4 0-1.8L8.7 3.9C8 3.4 7 3.9 7 4.8z"/></svg></span><span id="t2">따라 한 소리 다시 듣기</span></div>

<script>
  // ?lang=en / ?lang=ja / ?lang=ru / ?lang=es / ?lang=zh-tw / ?lang=zh-cn / ?lang=th / ?lang=bn / ?lang=hi / ?lang=vi render the English / Japanese / Russian / Spanish / Traditional / Simplified Chinese / Thai / Bengali / Hindi / Vietnamese card from the same layout
  var lang = new URLSearchParams(location.search).get('lang');
  if (lang === 'en') {
    document.documentElement.lang = 'en';
    document.getElementById('h').innerHTML = 'While you’re out all day,<br><span class="hl">your parrot learns to talk</span>';
    document.getElementById('t1').textContent = 'Record in your own voice';
    document.getElementById('t2').textContent = 'Replay what it copied';
    document.getElementById('shot').src = '../assets/images/en/screen-summary.webp';
  } else if (lang === 'ja') {
    document.documentElement.lang = 'ja';
    document.getElementById('h').innerHTML = 'お出かけ中に、<br><span class="hl">うちの子が言葉を覚えます</span>';
    document.getElementById('f').innerHTML = '<b>App Store · Google Play</b>で無料';
    document.getElementById('t1').textContent = '自分の声で録音';
    document.getElementById('t2').textContent = 'まねした声を聞き返す';
    document.getElementById('shot').src = '../assets/images/ja/screen-summary.webp';
  } else if (lang === 'ru') {
    document.documentElement.lang = 'ru';
    document.getElementById('h').innerHTML = 'Пока вас нет дома,<br><span class="hl">попугай учится говорить</span>';
    document.getElementById('f').innerHTML = 'Бесплатно<b>в App Store и Google Play</b>';
    document.getElementById('t1').textContent = 'Запись вашим голосом';
    document.getElementById('t2').textContent = 'Слушайте, что он повторил';
    document.getElementById('shot').src = '../assets/images/ru/screen-summary.webp';
  } else if (lang === 'es') {
    document.documentElement.lang = 'es';
    document.getElementById('h').innerHTML = 'Mientras estás fuera,<br><span class="hl">tu loro aprende a hablar</span>';
    document.getElementById('f').innerHTML = 'Gratis<b>en App Store y Google Play</b>';
    document.getElementById('t1').textContent = 'Grabado con tu voz';
    document.getElementById('t2').textContent = 'Vuelve a oír lo que imitó';
    document.getElementById('shot').src = '../assets/images/es/screen-summary.webp';
  } else if (lang === 'zh-tw') {
    document.documentElement.lang = 'zh-Hant-TW';
    document.getElementById('h').innerHTML = '你不在家時，<br><span class="hl">鸚鵡也在學說話</span>';
    document.getElementById('f').innerHTML = '<b>App Store · Google Play</b> 免費下載';
    document.getElementById('t1').textContent = '用你的聲音錄音';
    document.getElementById('t2').textContent = '重聽牠模仿的聲音';
    document.getElementById('shot').src = '../assets/images/zh-tw/screen-summary.webp';
  } else if (lang === 'zh-cn') {
    document.documentElement.lang = 'zh-Hans-CN';
    document.getElementById('h').innerHTML = '你不在家时，<br><span class="hl">鹦鹉也在学说话</span>';
    document.getElementById('f').innerHTML = '<b>App Store · Google Play</b> 免费下载';
    document.getElementById('t1').textContent = '用你的声音录音';
    document.getElementById('t2').textContent = '回放它模仿的录音';
    document.getElementById('shot').src = '../assets/images/zh-cn/screen-summary.webp';
  } else if (lang === 'th') {
    document.documentElement.lang = 'th';
    document.getElementById('h').innerHTML = 'ระหว่างที่คุณออกไปข้างนอก<br><span class="hl">นกแก้วก็กำลังหัดพูด</span>';
    document.getElementById('f').innerHTML = 'ดาวน์โหลดฟรี<b>บน App Store และ Google Play</b>';
    document.getElementById('t1').textContent = 'อัดด้วยเสียงของคุณเอง';
    document.getElementById('t2').textContent = 'ฟังเสียงที่เลียนย้อนหลัง';
    document.getElementById('shot').src = '../assets/images/th/screen-summary.webp';
  } else if (lang === 'bn') {
    document.documentElement.lang = 'bn';
    document.getElementById('h').innerHTML = 'আপনি যখন বাইরে,<br><span class="hl">টিয়া পাখি তখন কথা শেখে</span>';
    document.getElementById('f').innerHTML = '<b>App Store · Google Play</b>ফ্রি ডাউনলোড';
    document.getElementById('t1').textContent = 'আপনার নিজের কণ্ঠে রেকর্ড';
    document.getElementById('t2').textContent = 'অনুকরণ করা আওয়াজ আবার শুনুন';
    document.getElementById('shot').src = '../assets/images/bn/screen-summary.webp';
  } else if (lang === 'hi') {
    document.documentElement.lang = 'hi';
    document.getElementById('h').innerHTML = 'आप बाहर हैं,<br><span class="hl">तोता बोलना सीख रहा है</span>';
    document.getElementById('f').innerHTML = '<b>App Store और Google Play</b> पर मुफ़्त';
    document.getElementById('t1').textContent = 'अपनी आवाज़ में रिकॉर्ड करें';
    document.getElementById('t2').textContent = 'नकल की गई आवाज़ दोबारा सुनें';
    document.getElementById('shot').src = '../assets/images/hi/screen-summary.webp';
  } else if (lang === 'vi') {
    document.documentElement.lang = 'vi';
    document.getElementById('h').innerHTML = 'Khi bạn vắng nhà,<br><span class="hl">vẹt vẫn học nói</span>';
    document.getElementById('f').innerHTML = 'Miễn phí trên <b>App Store và Google Play</b>';
    document.getElementById('t1').textContent = 'Ghi âm bằng giọng của bạn';
    document.getElementById('t2').textContent = 'Nghe lại tiếng vẹt bắt chước';
    document.getElementById('shot').src = '../assets/images/vi/screen-summary.webp';
  }
</script>
</body>
</html>
